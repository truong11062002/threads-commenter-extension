[project]
name = "threads-ai-commenter"
version = "0.3.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi[standard]>=0.136.1",
    "sqlalchemy>=2.0",
    "psycopg2-binary>=2.9.10",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.1",
    "fastapi-cloud-cli>=0.20.0",
]

[tool.setuptools.packages.find]
exclude = ["frontend*"]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]
