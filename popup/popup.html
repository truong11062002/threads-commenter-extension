<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Threads AI Commenter</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <div class="app">

    <!-- Header -->
    <header class="header">
      <div class="logo">
        <span class="logo-icon">✦</span>
        <div>
          <div class="logo-title">ThreadsAI</div>
          <div class="logo-sub">Auto Comment</div>
        </div>
      </div>
    </header>

    <!-- Config Section -->
    <div class="config-section" id="settingsPanel">

      <!-- Model row -->
      <div class="config-row">
        <label class="config-label" for="modelSelect">Model</label>
        <div class="model-select-wrap">
          <select id="modelSelect" class="model-select">
            <option value="">Loading models...</option>
          </select>
        </div>
        <div class="config-hint" id="modelStatus">Loading available models</div>
      </div>

      <!-- User voice row -->
      <div class="config-row">
        <label class="config-label" for="userVoiceInput">Your voice</label>
        <textarea
          id="userVoiceInput"
          class="voice-input"
          rows="4"
          placeholder="Example: I sound natural, lightly witty, casual, concise, specific, and never generic..."
          spellcheck="false"
        ></textarea>
        <div class="config-actions">
          <button class="save-key-btn" id="saveVoiceBtn">Save voice</button>
          <div class="config-hint" id="voiceStatus">Optional — used in every comment</div>
        </div>
      </div>

      <!-- Threads strategy row -->
      <div class="config-row">
        <label class="config-label" for="viralStrategyInput">Threads comment strategy</label>
        <textarea
          id="viralStrategyInput"
          class="voice-input"
          rows="4"
          placeholder="Example: Add a specific angle, make a grounded observation, and leave room for thoughtful replies..."
          spellcheck="false"
        ></textarea>
        <div class="template-grid" aria-label="Strategy templates">
          <button class="template-btn" id="sparkReplyTemplateBtn" type="button">
            <span class="template-title">Specific Reply</span>
            <span class="template-sub">Observation-first reply</span>
          </button>
          <button class="template-btn" id="valueDropTemplateBtn" type="button">
            <span class="template-title">Value Drop</span>
            <span class="template-sub">Add value + soft CTA</span>
          </button>
          <button class="template-btn" id="hotTakeTemplateBtn" type="button">
            <span class="template-title">Hot Take</span>
            <span class="template-sub">Contrarian + credibility</span>
          </button>
        </div>
        <div class="config-hint" id="strategyStatus">Pick a template or write your own strategy</div>
      </div>

      <div class="error-area" id="errorArea" style="display:none">
        <span class="error-icon">⚠</span>
        <span id="errorText"></span>
      </div>

    </div>

    <!-- Footer -->
    <footer class="footer">
      Open a Threads reply box, then click AI in the page
    </footer>

  </div>
  <script src="popup.js"></script>
</body>
</html>
